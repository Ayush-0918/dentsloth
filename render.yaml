# render.yaml — DentSloth 100% Free Tier Deployment Blueprint for Render
# Schema: https://docs.render.com/blueprint-spec
# Free Tier: Exactly 2 free services (Web Service + Static Site). No card required.

services:
  # ── 1. FastAPI Backend (Free Web Service) ─────────────────────────
  - type: web
    name: dentsloth-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: "production"
      - key: DEMO_MODE
        value: "false"
      - key: LLM_PROVIDER
        value: "hosted"
      - key: GEMMA_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: "dentsloth"
      - key: TABPFN_MODE
        value: "api"
      - key: TABPFN_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ENABLE_DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "https://dentsloth-web.onrender.com,https://dentsloth.onrender.com,https://dentsloth.tech"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: PYTHON_VERSION
        value: "3.12.0"

  # ── 2. Static Frontend (Free Static Site) ──────────────────────────
  - type: web
    name: dentsloth-web
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: "public, max-age=0, must-revalidate"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://dentsloth-api.onrender.com/api"
      - key: VITE_DEMO_MODE
        value: "false"
